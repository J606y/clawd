    <script>
      // 监听软键盘（VisualViewport）动态适配 iOS 键盘遮挡
      (function() {
        if (window.visualViewport) {
          function updateKeyboardInset() {
            var vv = window.visualViewport;
            var inset = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
            document.documentElement.style.setProperty("--keyboard-inset", inset > 30 ? inset + "px" : "0px");
          }
          window.visualViewport.addEventListener("resize", updateKeyboardInset);
          window.visualViewport.addEventListener("scroll", updateKeyboardInset);
        }
      })();
      // 捕获未处理异常避免白屏无响应，iOS Web App 模式下若被带入空白状态则支持兜底自愈。
      window.addEventListener("error", function (e) {
        console.error("Uncaught error:", e.error || e.message);
      });
      // 首帧前应用主题，避免深色模式下闪白。
      (function () {
        try {
          var t = localStorage.getItem("hp.theme");
          if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/react/main.tsx"></script>
  </body>
