<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>live confirm hit</title>
</head>
<body>
  <div class="shell">
    <div class="side-dock" data-kind="live" style="position:fixed;inset:0;transform:translate3d(0,0,0);z-index:40">
      <section class="dock-live" style="height:100%">
        <div class="stage" style="position:absolute;inset:0;touch-action:none">
          <canvas id="screen" width="390" height="844" style="position:absolute;inset:0;width:100%;height:100%;touch-action:none"></canvas>
        </div>
      </section>
    </div>
    <div id="cover" style="position:fixed;inset:0;z-index:100"></div>
    <div id="mount"></div>
  </div>
  <script type="module">
    import { createElement, useLayoutEffect, useState } from "react";
    import { createRoot } from "react-dom/client";
    import { ConfirmDialog } from "/src/react/docks/sheet-presence.tsx";
    import "/src/react/styles/index.css";
    import "/src/react/docks/docks.css";

    function Harness() {
      const [open, setOpen] = useState(true);
      useLayoutEffect(() => {
        window.hits = window.hits || { danger: 0, cancel: 0 };
        window.ready = true;
      }, []);
      return createElement(ConfirmDialog, {
        open,
        labelId: "dock-live-dlg-title",
        onClose: () => {
          window.hits.cancel += 1;
          setOpen(false);
        },
      }, createElement("div", { className: "dialog" },
        createElement("h3", { id: "dock-live-dlg-title" }, "clawd 正在执行任务"),
        createElement("p", null, "必须先确认任务已停止，才能开放人工输入。停止后不会自动恢复；浏览器保持打开。"),
        createElement("button", {
          type: "button",
          className: "danger",
          onClick: () => { window.hits.danger += 1; },
        }, "停止任务并接管"),
        createElement("button", {
          type: "button",
          onClick: () => {
            window.hits.cancel += 1;
            setOpen(false);
          },
        }, "取消"),
      ));
    }

    createRoot(document.getElementById("mount")).render(createElement(Harness));
  </script>
</body>
</html>
